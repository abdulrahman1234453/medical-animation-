name: Render Breastfeeding Video

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "public/**"
      - "scripts/**"
      - "NARRATION_AR.txt"
      - "package.json"
      - ".github/workflows/render-breastfeeding.yml"

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Node dependencies
        run: npm install
      - name: Generate narration and render MP4
        run: npm run build
      - name: Upload rendered video
        uses: actions/upload-artifact@v4
        with:
          name: breastfeeding-newborn-mp4
          path: out/breastfeeding-newborn.mp4
          if-no-files-found: error
          retention-days: 7
