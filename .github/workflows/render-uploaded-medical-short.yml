name: Render uploaded medical short

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: new-video-project
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: new-video-project/package.json
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      - name: Install Node dependencies
        run: npm install
      - name: Install Whisper
        run: python -m pip install --upgrade pip faster-whisper
      - name: Generate Arabic word-level captions
        run: python scripts/transcribe.py
      - name: Render MP4
        run: npx remotion render src/index.ts MedicalShort out/medical-short.mp4
      - name: Upload rendered video
        uses: actions/upload-artifact@v4
        with:
          name: medical-short-final
          path: new-video-project/out/medical-short.mp4
          if-no-files-found: error
          retention-days: 7